<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f7f7f7; }
        .starsucks-green { background-color: #00704A; }
        .starsucks-green-text { color: #00704A; }
        .starsucks-green-hover:hover { background-color: #00563C; }
        
        input[type="text"], input[type="email"], input[type="tel"] {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px;
            transition: all 0.2s;
        }
        input[type="text"]:focus, input[type="email"]:focus, input[type="tel"]:focus {
            border-color: #00704A;
            box-shadow: 0 0 0 1px #00704A;
        }

        /* Hide number input arrows */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>

    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-xl shadow-2xl p-8 md:p-10">
            <h1 class="text-3xl font-bold text-center mb-2 starsucks-green-text">Secure Checkout</h1>
            <p class="text-center text-gray-500 mb-6">Final step to enjoy your Starsucks order!</p>

            <!-- Order Summary -->
            <div class="bg-gray-50 p-4 rounded-lg mb-6 border border-gray-200">
                <h2 class="text-xl font-semibold mb-2 text-gray-700">Order Summary</h2>
                <div class="space-y-1 text-sm">
                    <div class="flex justify-between">
                        <span>Subtotal:</span>
                        <span class="font-medium">Rs. {{ subtotal }}</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Tax (18%):</span>
                        <span class="font-medium">Rs. {{ tax }}</span>
                    </div>
                    <div class="flex justify-between pt-2 border-t border-gray-300 total-row text-lg font-bold">
                        <span>Grand Total:</span>
                        <span id="total-price" class="starsucks-green-text">Rs. {{ total_amount }}</span>
                    </div>
                </div>
            </div>

            <form action="{{ url_for('checkout_order') }}" method="POST" id="checkout-form">
                
                <!-- 1. Contact and Shipping Information -->
                <div class="mb-8">
                    <h2 class="text-xl font-semibold mb-4 text-gray-700">1. Shipping & Contact</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="col-span-2">
                            <label for="customer_name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                            <input type="text" id="customer_name" name="customer_name" required class="w-full">
                        </div>
                        <div class="col-span-2 md:col-span-1">
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                            <input type="email" id="email" name="email" required class="w-full">
                        </div>
                        <div class="col-span-2 md:col-span-1">
                            <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                            <input type="tel" id="phone" name="phone" required class="w-full">
                        </div>
                        <div class="col-span-2">
                            <label for="address_line1" class="block text-sm font-medium text-gray-700 mb-1">Address Line 1</label>
                            <input type="text" id="address_line1" name="address_line1" required class="w-full" placeholder="Street address, P.O. Box, Company name, etc.">
                        </div>
                        <div class="col-span-2 md:col-cols-2 grid grid-cols-2 gap-4">
                            <div>
                                <label for="city" class="block text-sm font-medium text-gray-700 mb-1">City</label>
                                <input type="text" id="city" name="city" required class="w-full">
                            </div>
                            <div>
                                <label for="zip_code" class="block text-sm font-medium text-gray-700 mb-1">Zip/Postal Code</label>
                                <input type="text" id="zip_code" name="zip_code" required class="w-full">
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 2. Payment Information (Simulated) -->
                <div>
                    <h2 class="text-xl font-semibold mb-4 text-gray-700">2. Payment Details</h2>
                    <div class="space-y-4">
                        <div>
                            <label for="card_number" class="block text-sm font-medium text-gray-700 mb-1">Card Number (16 Digits)</label>
                            <input type="text" id="card_number" name="card_number" required maxlength="16" pattern="\d{16}" title="Card number must be 16 digits" class="w-full">
                        </div>
                        <div class="grid grid-cols-3 gap-4">
                            <div class="col-span-2">
                                <label for="expiry" class="block text-sm font-medium text-gray-700 mb-1">Expiry (MM/YY)</label>
                                <input type="text" id="expiry" name="expiry" required maxlength="5" pattern="\d{2}/\d{2}" title="Format must be MM/YY" placeholder="01/25" class="w-full">
                            </div>
                            <div>
                                <label for="cvv" class="block text-sm font-medium text-gray-700 mb-1">CVV</label>
                                <input type="text" id="cvv" name="cvv" required maxlength="4" pattern="\d{3,4}" title="CVV must be 3 or 4 digits" class="w-full">
                            </div>
                        </div>
                        
                        <div class="pt-4">
                            <button type="submit" 
                                class="w-full py-3 text-lg starsucks-green text-white font-bold rounded-lg starsucks-green-hover transition duration-150 shadow-md">
                                Pay Rs. {{ total_amount }} & Complete Order
                            </button>
                        </div>
                    </div>
                </div>
            </form>
            
            <p class="text-center text-xs text-gray-400 mt-6">Payment is simulated. No real transactions will occur.</p>
        </div>
    </div>
    
    <script>
        // Simple client-side validation for card inputs
        document.getElementById('card_number').addEventListener('input', function (e) {
            e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 16);
        });

        document.getElementById('cvv').addEventListener('input', function (e) {
            e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 4);
        });

        document.getElementById('expiry').addEventListener('input', function (e) {
            let value = e.target.value.replace(/[^0-9]/g, '');
            if (value.length > 2) {
                value = value.slice(0, 2) + '/' + value.slice(2, 4);
            }
            e.target.value = value.slice(0, 5);
        });
    </script>
</body>
</html>
